name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: "27.2.12479018"
      CMAKE_VERSION: "3.22.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: android-actions/setup-android@v3
      - name: Install NDK & CMake
        run: |
          sdkmanager "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}"
          echo "ANDROID_NDK_ROOT=${ANDROID_SDK_ROOT}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
      - name: Cross-compile OpenSSL (libcrypto, arm64-v8a)
        working-directory: android/native-deps
        run: bash build-openssl-android.sh
      - name: Build APK and collect resolved runtime sources
        working-directory: android
        run: bash ./gradlew :app:assembleDebug :app:collectRuntimeSources --console=plain
      - name: Package APK and corresponding source
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk "dist/disproid-receiver-${GITHUB_REF_NAME}.apk"
          python3 scripts/distribution.py source
      - uses: actions/upload-artifact@v4
        with:
          name: disproid-android-and-source
          path: dist/*
          if-no-files-found: error

  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Build app with bundled notices
        working-directory: mac
        run: bash make-app.sh
      - name: Zip and verify signature
        run: |
          codesign --verify --strict "mac/Disproid Helper.app"
          mkdir -p dist
          ditto -c -k --norsrc --noextattr --keepParent "mac/Disproid Helper.app" "dist/disproid-helper-${GITHUB_REF_NAME}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: disproid-mac
          path: dist/*.zip
          if-no-files-found: error

  verify-and-publish:
    needs: [build-android, build-mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@v4
        with:
          pattern: disproid-*
          path: dist
          merge-multiple: true
      - name: Verify binary notices and corresponding source before publishing
        run: python3 scripts/verify-distribution.py --directory dist
      - name: Publish all assets together
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: true
          body: |
            APK / Mac ZIP と同じビルドの対応ソース資材は `disproid-source-<tag>.tar.gz` です。
            この資材には OpenSSL・Gradle ランタイム依存のソースとビルド手順を含みます。
            ライセンス・第三者通知・正確なコミットは各アプリの「ライセンスとソース」から確認できます。
          generate_release_notes: true
